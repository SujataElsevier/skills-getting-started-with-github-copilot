<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Tic-Tac-Toe</h1>
      <h2>JSON-Driven Demo</h2>
    </header>

    <main>
      <section class="game-panel">
        <h3>Game Status</h3>
        <p id="ttt-status">Loading game...</p>
        <button id="ttt-reset" type="button">Reset Game</button>
      </section>

      <section class="game-panel">
        <h3>Board</h3>
        <div id="ttt-board" class="ttt-board" aria-label="Tic Tac Toe Board"></div>
      </section>
    </main>

    <footer>
      <p><a href="index.html">Back to Activities</a></p>
    </footer>

    <script src="tic_tac_toe.js"></script>
  </body>
</html>
